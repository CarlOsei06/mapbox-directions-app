<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Navigation System</title>
    <link href="style.css" rel="stylesheet">

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.16.1/mapbox-gl.css" rel="stylesheet" />
</head>

<body>
    <div id="controls">
        <input id="origin" type="text" placeholder="Origin (e.g., London)">
        <input id="destination" type="text" placeholder="Destination (e.g., Manchester)">
        <button id="goBtn">Get Directions</button>
    </div>

    <div id="map"></div>

    <script src="script.js"></script>
</body>
</html>
